<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pena PMI - Komunitas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pustaka Official Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- Header Application -->
  <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">Pena PMI</h1>
      <span class="text-xs bg-blue-700 px-2 py-1 rounded">Komunitas</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4 pb-20">

    <!-- Form Kirim Postingan Baru -->
    <div class="bg-white p-4 rounded-xl shadow border border-gray-200">
      <h2 class="font-semibold text-gray-700 mb-2">Bagikan Pengalaman Anda</h2>
      
      <input id="userName" type="text" placeholder="Nama Anda" class="w-full mb-2 p-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      
      <input id="userLocation" type="text" placeholder="Lokasi (misal: Hong Kong, Taiwan, dll)" class="w-full mb-2 p-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      
      <textarea id="postContent" rows="3" placeholder="Apa cerita atau pengalaman Anda hari ini?" class="w-full p-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 mb-2"></textarea>
      
      <button onclick="submitPost()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition">
        Kirim Postingan
      </button>
    </div>

    <!-- Feed Postingan -->
    <div id="postsFeed" class="space-y-4">
      <div class="text-center text-gray-500 text-sm py-4">Memuat postingan...</div>
    </div>

  </main>

  <!-- Skrip Integrasi Supabase -->
  <script>
    // Konfigurasi Supabase Anda
    const SUPABASE_URL = 'https://glndsgfeygeeqxqwilyp.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_uBKVsuHXQrExsj9GNKEOWQ_559pOp25';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Fungsi Mengambil Data Postingan dari Database
    async function fetchPosts() {
      const feedEl = document.getElementById('postsFeed');
      
      const { data: posts, error } = await supabase
        .from('posts')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Gagal mengambil data:', error);
        feedEl.innerHTML = '<div class="text-center text-red-500 text-sm py-4">Gagal memuat postingan.</div>';
        return;
      }

      if (!posts || posts.length === 0) {
        feedEl.innerHTML = '<div class="text-center text-gray-500 text-sm py-4">Belum ada postingan. Jadilah yang pertama!</div>';
        return;
      }

      feedEl.innerHTML = posts.map(post => `
        <div class="bg-white p-4 rounded-xl shadow border border-gray-200 space-y-2">
          <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-full bg-blue-500 text-white flex items-center justify-center text-xs font-bold">
              ${(post.user_name || 'U').charAt(0).toUpperCase()}
            </div>
            <div>
              <p class="font-semibold text-sm leading-none">${post.user_name || 'Pengguna'}</p>
              <p class="text-xs text-gray-400">${post.user_location || 'Lokasi tidak diisi'}</p>
            </div>
          </div>
          <p class="text-sm text-gray-700">${post.content}</p>
          <div class="text-xs text-gray-400 border-t pt-2">
            ${new Date(post.created_at).toLocaleString('id-ID')}
          </div>
        </div>
      `).join('');
    }

    // Fungsi Mengirim Postingan Baru ke Database
    async function submitPost() {
      const name = document.getElementById('userName').value.trim();
      const location = document.getElementById('userLocation').value.trim();
      const content = document.getElementById('postContent').value.trim();

      if (!name || !content) {
        alert('Silakan isi Nama dan Isian Postingan terlebih dahulu!');
        return;
      }

      const { data, error } = await supabase
        .from('posts')
        .insert([
          { 
            user_name: name, 
            user_location: location || 'Umum', 
            content: content 
          }
        ]);

      if (error) {
        alert('Gagal mengirim postingan: ' + error.message);
      } else {
        document.getElementById('postContent').value = '';
        fetchPosts();
      }
    }

    // Jalankan otomatis saat halaman selesai dimuat
    document.addEventListener('DOMContentLoaded', fetchPosts);
  </script>
</body>
</html>
